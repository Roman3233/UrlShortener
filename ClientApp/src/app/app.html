<header class="app-header">
    <div class="header-inner">
        <div class="nav-brand">
            <a routerLink="/" class="logo">
                <span class="logo-icon">🔗</span>
                <span class="logo-text">UrlShortener</span>
            </a>
            <nav class="nav-links">
                <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Short URLs</a>
                <a href="http://localhost:5062/About" class="nav-external">About</a>
            </nav>
        </div>

        <div class="user-section">
            @if (authService.isAuthenticated()) {
            <div class="user-profile">
                <span class="user-name">{{ authService.currentUser()?.login }}</span>
                <span class="role-badge" [class.badge-admin]="authService.currentUser()?.role === 'Admin'">
                    {{ authService.currentUser()?.role }}
                </span>
            </div>
            <button type="button" class="btn-logout" (click)="onLogout()">Logout</button>
            } @else {
            <a routerLink="/login" class="btn-login">Login</a>
            }
        </div>
    </div>
</header>

<main class="main-content">
    <router-outlet></router-outlet>
</main>

<app-toast></app-toast>
